name: Automated IPO Sync Cron

on:
  schedule:
    # Runs every 30 minutes (24/7) for free via GitHub Actions
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-ipos:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger IPOCraft Live Sync
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://ipocraft.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || 'ipocraft_cron_secret_live_2026' }}"
          echo "Triggering sync on $SITE_URL..."
          curl -f -s -X GET "$SITE_URL/api/cron/sync?type=all&secret=$CRON_SECRET" || echo "Sync endpoint reached."
