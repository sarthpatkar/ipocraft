name: IPOCraft Automated Data Sync

on:
  schedule:
    # Every 30 minutes — Full FinAPI sync (GMP + Subscriptions)
    # FinAPI Pro allows 120 req/min — completely safe
    - cron: '*/30 * * * *'
    # Every 6 hours — IPOAlerts enrichment (quota: max 23/day)
    # Runs at: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions UI

jobs:
  # ── Job 1: FinAPI Full Sync (every 30 minutes) ──────────────────────────────
  sync-finapi:
    name: FinAPI Full Sync
    runs-on: ubuntu-latest
    # Only run for the 30-minute schedule (not the 6-hour one)
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '*/30 * * * *')
    steps:
      - name: Trigger FinAPI Full Sync
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://www.ipocraft.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || 'ipocraft_cron_secret_live_2026' }}"
          echo "🔄 Triggering FinAPI full sync on $SITE_URL..."
          
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X GET "$SITE_URL/api/cron/sync?type=all&secret=$CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/sync_response.json || true
          echo ""
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ FinAPI sync failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ FinAPI sync completed successfully."

  # ── Job 2: IPOAlerts Enrichment (every 6 hours) ───────────────────────────
  enrich-ipoalerts:
    name: IPOAlerts Enrichment
    runs-on: ubuntu-latest
    # Only run for the 6-hour schedule OR manual dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 */6 * * *')
    steps:
      - name: Trigger IPOAlerts Enrichment
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://www.ipocraft.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || 'ipocraft_cron_secret_live_2026' }}"
          echo "✨ Triggering IPOAlerts enrichment on $SITE_URL..."
          
          HTTP_STATUS=$(curl -s -o /tmp/enrich_response.json -w "%{http_code}" \
            -X GET "$SITE_URL/api/cron/sync?type=enrich&secret=$CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/enrich_response.json || true
          echo ""
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ IPOAlerts enrichment failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ IPOAlerts enrichment completed successfully."
