name: IPOCraft Automated Data Sync

on:
  schedule:
    # Every 30 minutes — Full FinAPI sync (GMP + Subscriptions)
    # FinAPI Pro allows 120 req/min — completely safe
    # Offset to :07/:37 (not :00/:30) — GitHub Actions queues every
    # schedule that fires on the hour/half-hour together, which is what
    # was pushing our 08:30 IST digest out to ~15:00+ IST some days.
    - cron: '7,37 * * * *'
    # Every 6 hours — IPOAlerts enrichment (quota: max 23/day)
    # Runs at: 00:15, 06:15, 12:15, 18:15 UTC — offset off the hour for
    # the same reason as above.
    - cron: '15 */6 * * *'
    # Daily at 04:05 UTC (09:35 AM IST) — Email GMP digest.
    # Target is 09:30 AM IST; offset by 5 min off the exact hour so this
    # isn't competing with every other repo's 04:00 UTC cron job.
    - cron: '5 4 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions UI

jobs:
  # ── Job 1: FinAPI Full Sync (every 30 minutes) ──────────────────────────────
  sync-finapi:
    name: FinAPI Full Sync
    runs-on: ubuntu-latest
    # Only run for the 30-minute schedule (not the 6-hour one)
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '7,37 * * * *')
    steps:
      - name: Trigger FinAPI Full Sync
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://www.ipocraft.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET repository secret is not set — refusing to run with no secret."
            exit 1
          fi
          echo "🔄 Triggering FinAPI full sync on $SITE_URL..."
          
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X GET "$SITE_URL/api/cron/sync?type=all&secret=$CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/sync_response.json || true
          echo ""
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ FinAPI sync failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ FinAPI sync completed successfully."

  # ── Job 2: IPOAlerts Enrichment (every 6 hours) ───────────────────────────
  enrich-ipoalerts:
    name: IPOAlerts Enrichment
    runs-on: ubuntu-latest
    # Only run for the 6-hour schedule OR manual dispatch
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '15 */6 * * *')
    steps:
      - name: Trigger IPOAlerts Enrichment
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://www.ipocraft.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET repository secret is not set — refusing to run with no secret."
            exit 1
          fi
          echo "✨ Triggering IPOAlerts enrichment on $SITE_URL..."
          
          HTTP_STATUS=$(curl -s -o /tmp/enrich_response.json -w "%{http_code}" \
            -X GET "$SITE_URL/api/cron/sync?type=enrich&secret=$CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/enrich_response.json || true
          echo ""
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ IPOAlerts enrichment failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ IPOAlerts enrichment completed successfully."

  # ── Job 3: Daily Email GMP Digest (09:30 AM IST) ──────────────────────────
  send-alerts:
    name: Daily Email GMP Digest
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '5 4 * * *')
    steps:
      - name: Trigger Email Digest Send
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://www.ipocraft.com' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET repository secret is not set — refusing to run with no secret."
            exit 1
          fi
          echo "✉️ Triggering daily GMP digest email on $SITE_URL..."

          HTTP_STATUS=$(curl -s -o /tmp/alerts_response.json -w "%{http_code}" \
            -X GET "$SITE_URL/api/alerts/send?secret=$CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/alerts_response.json || true
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Email digest send failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Email digest sent successfully."
